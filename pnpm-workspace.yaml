packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: 4.1.10
  vite-plus: ^0.2.6
  "@hono/vite-build": ^1.11.1
  "@hono/vite-dev-server": ^0.26.0
  dotenv: ^17.4.2
  openid-client: ^6.8.4
  jose: ^6.2.3
  awilix: ^13.0.5
  zod: ^4.4.3
  "@hono/zod-validator": ^0.8.0
  axios: ^1.18.0
  "@tanstack/react-query": ^5.101.0
  # Router and its Vite plugin must move in lockstep — the plugin peer-depends on
  # a `^`-pinned @tanstack/react-router, so bump both together.
  "@tanstack/react-router": ^1.170.18
  "@tanstack/router-plugin": ^1.168.23
  "@tanstack/react-table": ^8.21.3
  recharts: ^3.3.0
  tailwindcss: ^4.3.1
  "@tailwindcss/vite": ^4.3.1
  # shadcn/ui runtime: `radix-ui` is the unified package the radix-nova / Molca
  # registry items import from. `@radix-ui/react-slot` is still needed for
  # `@molca/button`'s `asChild`.
  radix-ui: ^1.6.7
  "@radix-ui/react-slot": ^1.3.0
  shadcn: ^4.13.0
  "@fontsource/poppins": ^5.2.7
  i18next: ^26.3.6
  react-i18next: ^17.0.9
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  lucide-react: ^1.27.0
  # Toast notifications. `sonner` is what shadcn's RADIX registry ships for this
  # (the `base` registry's Toast wraps Base UI, which would put a second headless
  # primitive library next to radix-ui). Mounted once in main.tsx.
  sonner: ^2.0.8
  tw-animate-css: ^1.4.0
  loglayer: ^9.3.0
  "@loglayer/transport-pino": ^3.2.0
  "@loglayer/plugin-opentelemetry": ^3.2.0
  pino: ^10.3.1
  pino-pretty: ^13.1.3
  "@opentelemetry/api": ^1.9.1
  "@opentelemetry/sdk-node": ^0.219.0
  "@opentelemetry/sdk-metrics": ^2.8.0
  "@opentelemetry/exporter-trace-otlp-proto": ^0.219.0
  "@opentelemetry/exporter-metrics-otlp-proto": ^0.219.0
  "@opentelemetry/instrumentation-http": ^0.219.0
  "@opentelemetry/instrumentation-undici": ^0.29.0
  "@hono/otel": ^1.1.2
  happy-dom: ^20.11.2
  "@testing-library/react": ^16.3.2
  "@testing-library/dom": ^10.4.1
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - hono@4.12.26
allowBuilds:
  esbuild: true
  # Test-only: apps/api stubs outbound master-data calls with `msw/node`. The
  # browser service worker is never used, so its postinstall has nothing to do.
  msw: true
  protobufjs: true
