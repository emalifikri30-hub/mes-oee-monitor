apiVersion: 1

providers:
  - name: oee
    type: file
    # File-provisioned, and deliberately NOT editable in the UI: the dashboard is
    # checked in, so a change made by clicking would be lost on the next restart
    # and would not be reviewable. Edit the JSON.
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
