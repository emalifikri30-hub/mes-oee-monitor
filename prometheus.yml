global:
  scrape_interval: 15s
  # How often the rules in prometheus-alerts.yml are evaluated. Matched to the
  # scrape interval: evaluating faster than the data arrives just re-reads the
  # same sample.
  evaluation_interval: 15s

# The alert rules metrics.ts has been describing in `// Alert on:` comments all
# along. See TODOS.md §39 for why they lived only in comments until now.
rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  # Scrape the metrics the OTel Collector re-exports from bff + api.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
